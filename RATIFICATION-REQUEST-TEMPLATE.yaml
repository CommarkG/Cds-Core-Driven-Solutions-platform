## HOW TO USE THIS TEMPLATE

1. Copy this file to `RATIFICATION-REQUEST-[ARTIFACT-ID].md`
2. Fill in all [BRACKETS]
3. Remove the "Copy → fill in → submit" note from the title
4. Verify ZF-0 passes before submitting
5. Present to Governor — wait for signature before advancing wiring_state
6. On ratification: create `RATIFICATION-[ARTIFACT-ID].yaml` per existing records
   (see RATIFICATION-CS-PE-001.yaml, RATIFICATION-CS-GOAL-001.yaml as examples)

