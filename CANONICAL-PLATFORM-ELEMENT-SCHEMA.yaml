# ═══════════════════════════════════════════════════════
# PART 1 — SCHEMA FIELD DEFINITIONS
# All 14 fields from PCR-001 SKELETON. No additions.
# ═══════════════════════════════════════════════════════

schema_fields:

  # ─── GROUP 1: CORE FIELDS (6) ───────────────────────

  schema_position:
    type: string
    required: true
    immutable_after: RATIFIED
    format: "CDS.[ROOT].[TRUNK].[BRANCH]"
    format_regex: "^CDS\\.[A-Z][A-Z0-9_]*\\.[A-Z][A-Z0-9_]*\\.[A-Z][A-Z0-9_]*$"
    rules:
      - Exactly 4 dot-separated segments
      - First segment is always the literal string CDS
      - Second segment is ROOT — must be SYSTEM or DOMAIN
      - Third segment is TRUNK — uppercase, underscores allowed
      - Fourth segment is BRANCH — uppercase, underscores allowed
      - No lowercase letters
      - No spaces
    validation_error: >
      VALIDATION_FAILED: schema_position '[value]' does not match CDS.[ROOT].[TRUNK].[BRANCH].
      Requirements: 4 dot-separated segments, all uppercase, first segment must be CDS,
      second segment must be SYSTEM or DOMAIN.
      Example of valid value: CDS.SYSTEM.GOVERNANCE.PLATFORM_ELEMENT

  corespine_context:
    type: string
    required: true
    format: "CS-[DOMAIN]-[SEQ]"
    rules:
      - Must be a valid corespine ID present in CORESPINE-REGISTRY.yaml
      - Referenced corespine must be at wiring_state REACHABLE or CURRENT at time of node creation
      - ADMIN-only nodes may reference corespines at WIRED state if explicitly authorized by Governor
      - Cannot be changed without a PCR
    validation_error: >
      VALIDATION_FAILED: corespine_context '[value]' not found in CORESPINE-REGISTRY.yaml
      or found at wiring_state below REACHABLE. Verify the corespine ID is exact
      (format CS-[DOMAIN]-[SEQ]) and that the corespine is REACHABLE or CURRENT.
      Current ratified corespines: CS-PE-001.

  definition:
    type: string
    required: true
    min_length: 20
    rules:
      - Must be a complete sentence ending with a period
      - Must describe what the element IS and what it governs — not what it might do
      - Banned phrases that trigger rejection: ["obviously", "standard", "clearly", "etc.",
        "as usual", "general purpose", "various", "everything", "anything", "simple"]
      - Must be specific enough that a different author would produce the same boundary judgment
      - No first-person language
    validation_error: >
      VALIDATION_FAILED: definition '[value]' contains vague language or is incomplete.
      Detected trigger: '[trigger_word]'. Replace with specific, observable description
      of what this element governs. Definition must be a complete sentence, minimum 20 characters,
      no banned vague terms. Test: could a different author draw the same boundary from this?

  usage_boundaries:
    type: object
    required: true
    required_fields: [applies_to, does_not_apply_to]
    rules:
      - Both applies_to and does_not_apply_to must be present
      - Each must be a non-empty array with at least one string entry
      - Entries must be specific (not "all governance decisions" — name the specific type)
      - does_not_apply_to must name at least one element_id or domain that handles the excluded case
    structure:
      applies_to:
        type: array
        min_items: 1
        item_type: string
      does_not_apply_to:
        type: array
        min_items: 1
        item_type: string
    validation_error: >
      VALIDATION_FAILED: usage_boundaries requires both applies_to AND does_not_apply_to
      as non-empty arrays. Missing or empty: '[field_name]'. Each array must contain at
      least one specific string entry. Example applies_to: ["PE scoring decisions for
      all ADMIN-tier submissions"]. Example does_not_apply_to: ["Platform trust tier
      decisions — those belong to GE-TRUST-001"].

  inheritance_chain:
    type: object
    required: true
    required_fields: [inherits_from, inherited_by]
    rules:
      - Both inherits_from and inherited_by must be present as arrays
      - Empty arrays [] are valid (root nodes have empty inherits_from; leaf nodes have empty inherited_by)
      - Array entries must be valid element_ids in the registry (format GE-[DOMAIN]-[SEQ])
      - Circular inheritance is forbidden — if A inherits_from B, B cannot inherit_from A
      - inherits_from entries must be at wiring_state REACHABLE or CURRENT
    structure:
      inherits_from:
        type: array
        item_type: string
        item_format: "GE-[DOMAIN]-[SEQ]"
      inherited_by:
        type: array
        item_type: string
        item_format: "GE-[DOMAIN]-[SEQ]"
    validation_error: >
      VALIDATION_FAILED: inheritance_chain requires both inherits_from and inherited_by as arrays.
      If no parents: inherits_from: []. If no children: inherited_by: [].
      All entries must match GE-[DOMAIN]-[SEQ] format and exist in the registry.
      Circular inheritance detected: '[element_a]' and '[element_b]' reference each other.

  falsification_test:
    type: string
    required: true
    min_length: 30
    rules:
      - Must describe observable outputs or system states — not intentions or expectations
      - Banned modal verbs in this field: ["should", "would", "might", "could", "may"]
      - Must name at least one specific file, field, or system output that can be checked
      - Test must be runnable without AI judgment — a tool or script could perform it
    validation_error: >
      VALIDATION_FAILED: falsification_test '[value]' contains non-observable language
      or is too abstract. Detected: '[banned_word]'. Describe actual, checkable outputs.
      Example of valid test: "PE scoring engine audit log contains element_id GE-PE-001
      for every scoring decision; removing this entry causes C3 violation flag."
      Test must be runnable by a tool, not requiring AI interpretation.

  # ─── GROUP 2: T-MODEL FIELDS (4) ────────────────────

  element_id:
    type: string
    required: true
    immutable: true
    format: "GE-[DOMAIN]-[SEQ]"
    format_regex: "^GE-[A-Z]{2,6}-[0-9]{3}$"
    rules:
      - Domain segment: 2 to 6 uppercase letters
      - Sequence segment: exactly 3 digits, zero-padded (001, 002, ... 099, 100)
      - Must be globally unique across the entire element registry
      - Assigned at SEED stage; never changed after assignment
      - If an element is archived, its ID is retired — never reused
      - Distinct from DecisionNode IDs (DN-[domain]-[seq] format) — those belong to System A
    validation_error: >
      VALIDATION_FAILED: element_id '[value]' does not match GE-[DOMAIN]-[SEQ].
      Domain: 2-6 uppercase letters. Sequence: 3 digits.
      Valid examples: GE-GOV-001, GE-PE-001, GE-CON-001.
      Duplicate check: '[value]' already exists in the registry.
      Note: DN-[domain]-[seq] IDs belong to the DecisionNode content schema (System A) — do not use here.

  element_type:
    type: enum
    required: true
    immutable_after: RATIFIED
    allowed_values: [SYSTEM, DOMAIN]
    rules:
      - SYSTEM — infrastructure, protocols, cross-platform governance mechanisms
      - DOMAIN — business-domain-specific concerns, platform-facing capabilities
      - The distinction is: SYSTEM elements govern HOW the platform operates;
        DOMAIN elements govern WHAT the platform manages
      - When in doubt — if it must exist for any domain to function, it is SYSTEM
    validation_error: >
      VALIDATION_FAILED: element_type must be SYSTEM or DOMAIN — found '[value]'.
      SYSTEM: infrastructure and governance mechanisms (e.g. scoring engine, audit, ratification).
      DOMAIN: business concerns managed by the platform (e.g. consulting capabilities, corespines).

  trunk_position:
    type: string
    required: true
    immutable_after: RATIFIED
    format: "ROOT.[SYSTEM|DOMAIN].[TRUNK]"
    rules:
      - Must begin with ROOT.SYSTEM or ROOT.DOMAIN (must match element_type)
      - May extend to ROOT.[TYPE].[TRUNK].[BRANCH] for deeper hierarchy
      - All segments uppercase
      - trunk_position must be consistent with schema_position
        (schema_position CDS.SYSTEM.X.Y → trunk_position ROOT.SYSTEM.X)
    validation_error: >
      VALIDATION_FAILED: trunk_position '[value]' must begin with ROOT.SYSTEM or ROOT.DOMAIN
      and must match the element's element_type. Found element_type=[element_type] but
      trunk_position begins with '[found_root]'. All segments must be uppercase.
      Example: element_type=SYSTEM → trunk_position=ROOT.SYSTEM.GOVERNANCE

  authority_tier:
    type: enum
    required: true
    allowed_values: [ADMIN, TRUSTED]
    rules:
      - ADMIN — only CDS (Governor-authorized) can create or modify this element
      - TRUSTED — vetted platforms may reference but not modify; ADMIN creates
      - SYSTEM elements are always ADMIN
      - DOMAIN elements may be ADMIN or TRUSTED depending on whether platform input governs scope
      - authority_tier governs write access; read/reference access follows wiring_state rules
    validation_error: >
      VALIDATION_FAILED: authority_tier must be ADMIN or TRUSTED — found '[value]'.
      ADMIN: only CDS/Governor can create or modify.
      TRUSTED: ADMIN creates; TRUSTED platforms may reference when element is REACHABLE or CURRENT.

  # ─── GROUP 3: STATE FIELDS (4) ──────────────────────

  wiring_state:
    type: enum
    required: true
    allowed_values: [DEFINED, WIRED, REACHABLE, CURRENT]
    sequence_rule: "DEFINED → WIRED → REACHABLE → CURRENT"
    rules:
      - States must advance in sequence — skipping is forbidden
      - Downgrading requires PCR + Governor approval
      - DEFINED: schema fields complete; not yet connected to any consuming system
      - WIRED: connected to at least one consuming system; other systems can reference
      - REACHABLE: all declared consuming systems connected; verified to pass data correctly
      - CURRENT: ZF-0 achieved across all three categories; Governor ratified
    validation_error: >
      VALIDATION_FAILED: wiring_state must be one of DEFINED|WIRED|REACHABLE|CURRENT
      in sequence — found '[value]'. Cannot skip states. Cannot downgrade without PCR.
      Attempted transition '[from_state]' → '[to_state]' is not a valid forward step.

  ratification_state:
    type: enum
    required: true
    allowed_values: [PROPOSED, RATIFIED, SUPERSEDED, ARCHIVED]
    rules:
      - PROPOSED: element created; awaiting Governor ratification
      - RATIFIED: Governor signed; element is authoritative — changes require PCR
      - SUPERSEDED: replaced by a newer version; old element still readable for audit trail
      - ARCHIVED: retired; element_id is permanently retired — never reassigned
      - wiring_state CURRENT requires ratification_state RATIFIED
      - A PROPOSED element cannot reach REACHABLE or CURRENT wiring state
    validation_error: >
      VALIDATION_FAILED: ratification_state must be one of PROPOSED|RATIFIED|SUPERSEDED|ARCHIVED
      — found '[value]'. Constraint: wiring_state CURRENT requires ratification_state RATIFIED.
      A PROPOSED element cannot advance past WIRED without Governor ratification.

  created_session:
    type: string
    required: true
    immutable: true
    format: "ISO date YYYY-MM-DD"
    rules:
      - Set once at element creation; never modified
      - Must be ISO date (YYYY-MM-DD) or session identifier (session-[identifier])
      - Cannot be a future date
      - Used for audit trail and sequence verification
    validation_error: >
      VALIDATION_FAILED: created_session '[value]' must be an ISO date (YYYY-MM-DD) or
      session identifier (session-[id]). Future dates not accepted.
      This field is immutable after element creation.

  last_modified_session:
    type: string
    required: true
    format: "ISO date YYYY-MM-DD"
    rules:
      - Updated on every change to the element record
      - Must be same as or chronologically later than created_session
      - Must be ISO date (YYYY-MM-DD) or session identifier
      - If no changes since creation, equals created_session
    validation_error: >
      VALIDATION_FAILED: last_modified_session '[value]' must be an ISO date (YYYY-MM-DD)
      or session identifier, and must not be earlier than created_session '[created_value]'.


# ═══════════════════════════════════════════════════════
# PART 2 — REGISTRY INTEGRITY RULES
# Rules that apply to the registry as a whole (not per-field)
# ═══════════════════════════════════════════════════════

registry_integrity_rules:

  uniqueness:
    - element_id must be globally unique across all entries in this file
    - schema_position must be unique (two elements cannot occupy the same position)
    - Error: "REGISTRY_INTEGRITY_FAILED: Duplicate [element_id|schema_position] detected —
      '[value]' already exists. Assign a new unique ID or position."

  orphan_prevention:
    - Every element_id referenced in inheritance_chain.inherits_from or inherited_by
      must exist in this registry
    - Error: "REGISTRY_INTEGRITY_FAILED: inheritance_chain references element_id '[value]'
      which does not exist in the registry. Create the referenced element first
      or correct the ID."

  consistency:
    - element_type SYSTEM must have trunk_position starting ROOT.SYSTEM
    - element_type DOMAIN must have trunk_position starting ROOT.DOMAIN
    - schema_position root segment must match element_type (CDS.SYSTEM.x.x or CDS.DOMAIN.x.x)
    - wiring_state CURRENT requires ratification_state RATIFIED
    - Error: "REGISTRY_INTEGRITY_FAILED: element_type, trunk_position, and schema_position
      are inconsistent for element '[element_id]'. All three must agree on SYSTEM or DOMAIN."

  admission_gate:
    - New elements require SEED justification + SKELETON fields complete before entry
    - Entry into this file is the FLESH stage output — not the SEED stage
    - An element exists in this file only when FLESH is complete
    - Partial records (missing required fields) are rejected at file write time

  id_namespace_separation:
    - GE-[DOMAIN]-[SEQ] IDs are reserved for this registry (platform governance elements)
    - DN-{domain}-{seq} IDs belong to System A (decision-node-v1.1.schema.yaml — decision content)
    - The two namespaces must never cross-reference each other
    - Error: "REGISTRY_INTEGRITY_FAILED: element_id '[value]' uses DN- prefix which belongs
      to the DecisionNode content schema (System A). Use GE- prefix for platform elements."


# ═══════════════════════════════════════════════════════
# PART 3 — ELEMENT REGISTRY
# 3 registered elements: SYSTEM, cross-cutting, DOMAIN
# ═══════════════════════════════════════════════════════

element_registry:

  # ─── ELEMENT 1: SYSTEM — Priority Engine Authority ──

  - element_id: GE-PE-001
    element_type: SYSTEM
    schema_position: CDS.SYSTEM.GOVERNANCE.PRIORITY_ENGINE
    trunk_position: ROOT.SYSTEM.GOVERNANCE
    authority_tier: ADMIN
    corespine_context: CS-PE-001

    definition: >
      The governing authority element for all Priority Engine decisions — defining what
      constitutes a scoreable work item, what formula applies, and what audit record
      must be produced for every score calculation.

    usage_boundaries:
      applies_to:
        - "All PE scoring decisions across every work item type (PCR, corespine, consulting, pattern)"
        - "All Governor-queue entries ordered by PE formula output"
        - "All audit log entries recording formula inputs and outputs (C3 compliance)"
      does_not_apply_to:
        - "Ratification authority decisions — those belong to GE-GOV-001"
        - "Trust tier classification decisions — those belong to GE-TRUST-001 (not yet defined)"
        - "Vocabulary canonical ownership — that belongs to GE-VOC-001 (not yet defined)"

    inheritance_chain:
      inherits_from: []
      inherited_by:
        - GE-GOV-001

    falsification_test: >
      Phase A (verifiable now): CANONICAL-PLATFORM-ELEMENT-SCHEMA.yaml exists and contains
      element_id GE-PE-001. CORESPINE-REGISTRY.yaml CS-PE-001 block contains field
      governance_element_id: GE-PE-001 referencing this entry. RATIFICATION-CS-PE-001.yaml
      contains governance_element_id: GE-PE-001. All three references resolve to this element.
      Phase B (verifiable when scoring engine exists): every entry in pe/logs/scoring-audit.jsonl
      contains element_id: GE-PE-001; removing this element from the registry causes scoring engine
      to emit REGISTRY_UNREACHABLE and halt per CS-PE-001 C4.

    wiring_state: CURRENT
    ratification_state: RATIFIED
    created_session: "2026-07-15"
    last_modified_session: "2026-07-20"

  # ─── ELEMENT 2: CROSS-CUTTING — Governance Ratification Authority ──

  - element_id: GE-GOV-001
    element_type: SYSTEM
    schema_position: CDS.SYSTEM.GOVERNANCE.RATIFICATION
    trunk_position: ROOT.SYSTEM.GOVERNANCE
    authority_tier: ADMIN
    corespine_context: CS-PE-001

    definition: >
      The authority element governing all Governor ratification decisions — defining what
      constitutes a ratifiable artifact, what GOV-ID format is assigned, and what
      transition conditions must be proven before ratification_state advances to RATIFIED.

    usage_boundaries:
      applies_to:
        - "All PCR ratification records (PCR-001, PCR-002, and all future PCRs)"
        - "All corespine ratification records in CORESPINE-REGISTRY.yaml"
        - "All pattern ratification records in the pattern archive"
        - "All consulting system gate ratifications (L1.9, L2.x, L3.x)"
        - "All DOMAIN element ratifications — this element is cross-cutting"
      does_not_apply_to:
        - "PE scoring formula decisions — those reference GE-PE-001"
        - "Trust tier demotion/promotion decisions — those belong to GE-TRUST-001"
        - "Vocabulary dispute resolutions — those belong to GE-VOC-001"

    inheritance_chain:
      inherits_from:
        - GE-PE-001
      inherited_by:
        - GE-CON-001

    falsification_test: >
      Every ratification record in the CDS registry (CORESPINE-REGISTRY.yaml,
      pattern archive PAT-*.yaml, PCR files) contains a field gov_id matching
      format GOV-[YYYYMMDD]-[SEQ] that resolves to an element referencing GE-GOV-001.
      A ratification record without a valid gov_id is rejected at intake.
      Verified by: scanning all ratification records for gov_id field presence
      and cross-checking against GE-GOV-001 in this registry.

    wiring_state: WIRED
    ratification_state: RATIFIED
    created_session: "2026-07-20"
    last_modified_session: "2026-07-20"

  # ─── ELEMENT 3: DOMAIN — Consulting Capability ──────

  - element_id: GE-CON-001
    element_type: DOMAIN
    schema_position: CDS.DOMAIN.CONSULTING.CAPABILITY
    trunk_position: ROOT.DOMAIN.CONSULTING
    authority_tier: ADMIN
    corespine_context: CS-PE-001

    definition: >
      The authority element governing all consulting capability entries — defining what
      constitutes a valid CapabilityEntry, what schema_node field values are permitted,
      and what ADD workflow states a capability may occupy.

    usage_boundaries:
      applies_to:
        - "All CapabilityEntry records in CAPABILITY_REGISTRY.json"
        - "All ADD workflow validation decisions (schema_node field lookup)"
        - "All consulting system L1 → L2 transition decisions affecting capability scope"
        - "All consulting audit records tied to capability approvals or rejections"
      does_not_apply_to:
        - "Platform trust tier decisions — those belong to GE-TRUST-001 (not yet defined)"
        - "Glossary term ownership decisions — those belong to GE-VOC-001 (not yet defined)"
        - "Conflict escalation routing decisions — those belong to GE-ESC-001 (not yet defined)"

    inheritance_chain:
      inherits_from:
        - GE-GOV-001
      inherited_by: []

    falsification_test: >
      Phase A (verifiable now): CANONICAL-PLATFORM-ELEMENT-SCHEMA.yaml exists and contains
      element_id GE-CON-001. GE-CON-001 inherits_from GE-GOV-001 which exists in this registry.
      GE-GOV-001 inherited_by includes GE-CON-001. The inheritance chain is bi-directionally
      consistent across both elements with no orphan references.
      Phase B (verifiable when consulting L1 exists): every CapabilityEntry in
      CAPABILITY_REGISTRY.json contains schema_node: GE-CON-001; submitting a CapabilityEntry
      with absent or invalid schema_node causes ADD workflow to emit VALIDATION_FAILED and halt.

    wiring_state: DEFINED
    ratification_state: PROPOSED
    created_session: "2026-07-20"
    last_modified_session: "2026-07-20"


