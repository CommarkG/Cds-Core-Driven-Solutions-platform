corespines:
  - id: "CS-GOAL-001"
    name: "Goal Ratification Corespine"
    domain: "platform goals"
    ratification_state: "PENDING"
    ratification_governor_approval: "Awaiting Yariv decision: ratify now or during Phase A"
    trunk_position: "T1/Goal Governance/Goal Ratification"
    hook_scope: "ALL_TOOL_CALLS"
    hook_file: "scripts/pre-tool-corespine-hook.sh"
    enforcement_code: "threshold/src/gate/rules.ts → RULE-GOAL (line 54-85)"
    allowed_operations:
      - Read
      - Write
      - Edit
      - Bash
      - Glob
      - Grep
    blocked_operations:
      - modify_ratified_goal
      - delete_goal_record
    spine_constraints:
      - constraint_id: "CS-GOAL-001-C1"
        name: "Every goal must be ratified"
        description: "A goal that has not been ratified is an assumption. No pipeline activates without traceable ratified goal."
        hard_coded_check: "RULE-GOAL checks for GOV-[YEAR]-GOAL-[SEQUENCE] format and existence"
        status: "ACTIVE"

      - constraint_id: "CS-GOAL-001-C2"
        name: "Goal must have observable resolution signal"
        description: "Resolution signal must be verifiable by third party; not aspirational"
        hard_coded_check: "Declaration field enforced at goal creation time"
        status: "ACTIVE"

      - constraint_id: "CS-GOAL-001-PROPOSED-1"
        name: "Code enforcement equivalence"
        description: "A mechanical rule gate implementing a corespine's spine constraints is NOT equivalent to ratified corespine enforcement unless the rule reads its constraints from the corespine registry. Hardcoded rule values do not count as governed constraints."
        hard_coded_check: "RULE-GOAL must read constraint list from CORESPINE-REGISTRY.yaml at runtime, not hardcode validation logic"
        implementation_required: "Modify RULE-GOAL to: (1) query CORESPINE-REGISTRY for CS-GOAL-001 constraints, (2) validate goal against registry constraints, (3) reject if registry unreachable"
        falsification_test: "Add new constraint to CS-GOAL-001 in registry. New goals must respect it without code change."
        status: "PROPOSED_PENDING_RATIFICATION"
        source: "Session 2026-07-08: Independence protocol Q3"

  - id: "CS-CREATION-001"
