        hard_coded_check: "RULE-PE-HALT: PE startup check pings registry; failure triggers halt protocol"
        falsification_test: "Make CORESPINE-REGISTRY unreachable. PE must halt and log HALT message."
        status: "ACTIVE"
    proposed_constraints:
