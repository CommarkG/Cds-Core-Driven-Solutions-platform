## Output 2 — Mechanical Check Specification

```yaml
mechanical_check:
  trigger: >
    Before any constraint, rule, or protocol is marked ACTIVE or submitted for ratification.
    Also when scanning existing corespine records for constraint completeness.

  detection: >
    For each constraint or rule claiming structural enforcement (contains: "is required",
    "must be", "cannot be", "is forbidden", "is rejected", "is blocked", "enforces",
    "validates", "prevents"):
    Check whether an enforcement_code field exists pointing to a specific file and line.
    The field must contain: actual file path + line number where the enforcement runs.
    If claim exists without enforcement_code → VIOLATION.
    If enforcement_code contains "TBD", "to be built", "Phase B" without an explicit
    ANTICIPATED status label → VIOLATION.

  failure_output: >
    BLOCKED: constraint '[constraint_id]' in '[artifact_id]' claims structural enforcement
    without an enforcement_code pointer.
    Claim: '[claim_text]'
    Required: enforcement_code field containing real file path + line number.
    Example: "threshold/src/gate/rules.ts → RULE-GOAL (line 54-85)"
    If enforcement not yet built: label constraint status as ANTICIPATED, not ACTIVE.
    Ratification of an ANTICIPATED constraint is permitted — claiming it is ACTIVE is not.

  enforcement_layer: pre-ratification

  false_positive_risk: LOW
  false_positive_reason: >
    Constraints correctly labeled ANTICIPATED or PROPOSED do not violate this pattern.
    The check only triggers on constraints claiming ACTIVE status without enforcement_code.
    A constraint can be ratified as ANTICIPATED — that is honest and acceptable.

check_status: DEFINED
ratification_reference: null
ratification_date: null
wired_date: null
active_date: null
consecutive_clean_sessions: 0
```
