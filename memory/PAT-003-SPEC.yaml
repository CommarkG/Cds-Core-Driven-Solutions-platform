## Output 1 — Pattern Statement

A governance artifact declares that a structural rule exists ("layer declaration is required",
"corespine_context must be declared", "IDs must follow GE-[DOMAIN]-[SEQ]") without pointing
to specific code, a script line, or a gate that actually enforces the rule. The rule exists
in documentation only — it is not enforced anywhere mechanically.

**Observed in:** Corespine constraint definitions, schema validation rules, protocol
enforcement claims.
**When it appears:** When a constraint is ratified before its enforcement code is written.
The constraint is real. The enforcement is not yet real. But the document claims enforcement exists.
**Why it persists:** The constraint and the enforcement feel like the same thing.
Writing "this is enforced in rules.ts" in a document feels equivalent to the enforcement running.
**Cost:** Every structural rule without an enforcement mechanism is a request, not a constraint.
Requests drift. Constraints don't.

