# Ratification Record — CS-GOAL-001

## What Is Being Ratified

CS-GOAL-001 defines the governance rule: every platform goal must be ratified before
any pipeline activates against it. An unratified goal is an assumption — and assumptions
are not a basis for execution in CDS.

This corespine governs all goal-level decisions across the platform.

---

## Constraints Ratified

| Constraint ID | Name | Status |
|--------------|------|--------|
| CS-GOAL-001-C1 | Every goal must be ratified (GOV-ID format enforced) | RATIFIED |
| CS-GOAL-001-C2 | Goal must have observable resolution signal (verifiable by third party) | RATIFIED |
| CS-GOAL-001-PROPOSED-1 | Code enforcement equivalence (RULE-GOAL must read from registry) | PROPOSED — deferred to Phase B implementation |

---

## Falsification Tests (Phase A)

**C1:** CORESPINE-REGISTRY.yaml CS-GOAL-001 block contains constraint CS-GOAL-001-C1 with
status ACTIVE. threshold/src/gate/rules.ts RULE-GOAL (line 54–85) checks for GOV-[YEAR]-GOAL-[SEQ]
format. A goal submitted without this format is rejected.

**C2:** A goal entry without a `resolution_signal` field is rejected at creation time.
Verified by: checking CS-GOAL-001-C2 status = ACTIVE in CORESPINE-REGISTRY.yaml.

