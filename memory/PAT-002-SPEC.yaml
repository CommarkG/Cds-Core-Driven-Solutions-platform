## Output 1 — Pattern Statement

A governance artifact or session output claims that a hook, script, or gate "runs" or
"is active" without producing any proof that it executed. The claim is stated as fact,
but no timestamp, log entry, or audit record exists to confirm actual execution.

**Observed in:** Hook implementation claims in corespine records, prevention protocol
enforcement notes, session summaries claiming a gate fired.
**When it appears:** After a hook or script is designed but before it is verified.
The design is good — the proof that it ran is missing.
**Why it persists:** Designing a hook feels like activating it. Writing "hook is active"
in a document feels like proof. It is not.
**Cost:** Governance built on unverified execution is indistinguishable from
governance that only exists on paper.

