# ════════════════════════════════════════════════
# WHY THIS EXISTS
# ════════════════════════════════════════════════

why: |
  Phase B requires a working ratification system. PE's core mechanic (unratified = HELD)
  is meaningless without a working ratification workflow. If ratification cannot be triggered,
  approved, and recorded — PE cannot govern anything. This PCR defines what "ratification
  system functional" actually means, so Governor can declare it done.

# ════════════════════════════════════════════════
# WHAT "DONE" MEANS
# ════════════════════════════════════════════════

completion_criteria:
  - Governor can receive a ratification request (format: structured brief)
  - Governor can approve or reject with a record (format: RATIFICATION-[ID].yaml)
  - Approved ratification updates CORESPINE-REGISTRY.yaml ratification_state automatically or by CDS
  - At least 3 ratification cycles completed successfully (CS-THRESHOLD-001 is 1, CS-PE-001 is 2 — need 1 more test case)
  - CORESPINE-DASHBOARD.yaml shows accurate ratification counts (currently: 2 RATIFIED, 1 PARTIALLY_RATIFIED, 2 PENDING)
  - False-positive test: attempt to queue unratified action — must be HELD, not queued
  ratification_required: false
  note: "This is procedural/mechanical — no corespine ratification needed for the ratification system itself. Governor declares it functional by signing PCR-002 completion."

