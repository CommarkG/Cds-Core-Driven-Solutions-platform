## Output 2 — Mechanical Check Specification

```yaml
mechanical_check:
  trigger: >
    After any update to a source registry (CORESPINE-REGISTRY.yaml, CANONICAL-PLATFORM-ELEMENT-SCHEMA.yaml,
    WEEKLY-FINDINGS-QUEUE.yaml, or any file designated as a source for a derived index).
    Also at session-start audit to detect accumulated drift.

  detection: >
    For each pair (source_file, derived_index_file):
      1. Read the source_file — extract all entries of the tracked type (corespines, elements, findings).
      2. Count by status category (ratified, pending, etc.).
      3. Read the derived_index_file — extract the same counts from its summary fields.
      4. Compare: if any count differs between source and derived index → VIOLATION.
      5. Also check: derived_index_file.measurement_timestamp vs source_file.last_updated.
         If source is newer than index → VIOLATION (staleness detected).

    Tracked pairs:
      - source: memory/CORESPINE-REGISTRY.yaml → derived: memory/CORESPINE-DASHBOARD.yaml
      - source: CANONICAL-PLATFORM-ELEMENT-SCHEMA.yaml → derived: memory/SCHEMA-DASHBOARD.yaml (if exists)
      - source: memory/WEEKLY-FINDINGS-QUEUE.yaml → derived: queue_health block in same file (self-check)

  failure_output: >
    DRIFT DETECTED: '[derived_index_file]' is out of sync with '[source_file]'.
    Discrepancies:
      - [field]: derived shows [X], source has [Y]
      - measurement_timestamp: [derived_date] vs source last_updated: [source_date]
    Update '[derived_index_file]' to reflect current source state before session ends.
    Do not ratify any artifact that references the stale index until the index is corrected.

  enforcement_layer: session-start-scan + post-registry-update

  false_positive_risk: LOW
  false_positive_reason: >
    A newly created source file with no derived index yet is not a violation — it is a
    gap (no index exists yet). Only trigger on established pairs where the derived index
    exists but has stale data.

check_status: DEFINED
ratification_reference: null
