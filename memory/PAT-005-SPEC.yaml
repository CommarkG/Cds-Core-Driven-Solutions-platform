## Output 1 — Pattern Statement

A derived index (dashboard, summary, count, or status snapshot) falls out of sync with
the registry it derives from because no mechanism forces the index to update when the
source changes. The index silently shows stale data — old counts, incorrect ratification
states, missing new entries — while appearing to be the authoritative reference.

**Observed in:** CORESPINE-DASHBOARD.yaml vs CORESPINE-REGISTRY.yaml (ratified count wrong
after CS-GOAL-001 ratification), MEMORY.md index (references DO-DONT-REGISTRY.yaml which
doesn't exist on disk), CORESPINE-REGISTRY.yaml (CS-PE-001 entry positioned inside
proposed_ratifications block instead of corespines array).
**When it appears:** After any ratification, new entry, or status change in a registry.
The source is updated; the derived index is not because there is no trigger.
**Why it persists:** Updating the source feels like completing the work. The derived index
is a "reflection" that doesn't feel like part of the same update. No gate blocks ratification
if the dashboard disagrees.
**Cost:** Governance decisions made from a stale index are made on false data.
A count of "1 ratified corespine" when the actual number is 3 misrepresents the platform's
maturity to the Governor and any external reviewer.

**Connection to WISDOM-008:** "An index written by hand drifts. An index derived from
its source stays true." The fix is not discipline — it is making the index mechanically
derived so divergence is impossible.

