why: |
  PE cannot launch without a locked DecisionNode schema.
  PE reads action metadata fields (value, urgency, risk, effort, verification_cost) directly
  from DecisionNode at every scoring cycle. If schema changes after PE launches, scoring breaks.
  This is the single hardest blocker between now and Phase B build start.

