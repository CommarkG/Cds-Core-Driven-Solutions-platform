## Output 2 — Mechanical Check Specification

```yaml
mechanical_check:
  trigger: >
    Before any governance artifact is submitted for ratification. Also at session-start
    audit when scanning existing artifacts for compliance.

  detection: >
    For each artifact containing impossibility or prohibition language (phrases:
    "cannot", "no X can", "impossible without", "forbidden", "never reaches",
    "blocked by", "cannot bypass", "is prevented from", "must not", "will not"):
    Check whether an enforcement_code field exists OR a gate reference exists that
    points to a real file + line that performs the blocking.
    If the claim exists and:
      - No enforcement_code field present, OR
      - enforcement_code field is null, "Phase B", "to be built", or "TBD", OR
      - The referenced file does not exist on disk
    → VIOLATION.

  failure_output: >
    BLOCKED: artifact '[artifact_id]' contains impossibility claim without active enforcement.
    Claim found: '[claim_text]'
    Choose one:
      Option A: Add enforcement_code pointing to existing file + line that performs the block.
      Option B: Relabel claim as TELL (aspiration, not enforced) with status: ANTICIPATED.
      Option C: Open a PCR to build the enforcement; link PCR-ID in claim.
    "Phase B" and "to be built" are NOT valid enforcement references.

  enforcement_layer: pre-ratification

  false_positive_risk: MEDIUM
  false_positive_reason: >
    Some impossibility claims describe logical impossibility (structural schema constraint)
    not a runtime enforcement block. Example: "An element without schema_position cannot
    be registered" — where registration itself requires schema_position. These are
    architecturally enforced by definition, not by code. Flag for human review if
    the claim references a schema field gate rather than a code gate.

check_status: DEFINED
ratification_reference: null
ratification_date: null
wired_date: null
active_date: null
consecutive_clean_sessions: 0
```
