## Output 1 — Pattern Statement

A governance artifact asserts that something is impossible or prohibited ("no X can reach Y",
"cannot be bypassed", "is forbidden", "impossible without Z") without any enforcement code
or gate that actually blocks the prohibited action. The prohibition exists as a declaration
only — it is violated the moment someone does the "impossible" thing and nothing stops them.

**Observed in:** Corespine constraint descriptions, security boundary declarations,
gate requirements, Phase A architecture documents.
**When it appears:** When designing architecture before Phase B builds the enforcement.
Especially common when corespine constraints are written ahead of their implementation hooks.
**Why it persists:** "Impossible" feels like a stronger word than "should not."
It sounds mechanical without being mechanical. Nothing in the writing process forces the
author to check whether a blocking mechanism exists.
**Cost:** One successful bypass of an "impossible" claim destroys the credibility of every
other governance claim. A platform where "impossible" means "documented but unblocked" is
not governed — it is documented.

**Distinct from PAT-003:** PAT-003 covers structural claims ("this is required") without
enforcement. PAT-004 specifically covers impossibility/prohibition claims ("this cannot happen",
"this is forbidden", "no X without Y") — higher severity because these claims imply a hard
block that does not exist.

